name: Run tests and deploy Allure report

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env file
        run: |
          echo "POSTGRES_USER='${{ vars.POSTGRES_USER }}'" > .env
          echo "POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}'" >> .env
          echo "POSTGRES_DB_AUTH='${{ vars.POSTGRES_DB_AUTH }}'" >> .env
          echo "POSTGRES_DB_UNIVERSITY='${{ vars.POSTGRES_DB_UNIVERSITY }}'" >> .env
          echo "UNIVERSITY_SERVICE_INTERNAL_URL='${{ vars.UNIVERSITY_SERVICE_INTERNAL_URL }}'" >> .env
          echo "UNIVERSITY_SERVICE_API_URL='${{ vars.UNIVERSITY_SERVICE_API_URL }}'" >> .env
          echo "AUTH_SERVICE_INTERNAL_URL='${{ vars.AUTH_SERVICE_INTERNAL_URL }}'" >> .env
          echo "AUTH_SERVICE_API_URL='${{ vars.AUTH_SERVICE_API_URL }}'" >> .env

      - name: Start API services and wait
        run: docker compose up -d --wait

      - name: Run Alembic migrations
        run: |
          docker compose run --rm auth alembic upgrade head
          docker compose run --rm university alembic upgrade head

      - name: Run tests in Docker
        run: docker compose run --rm tests

      - name: Upload Allure results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/

  deploy-allure:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results/

      - name: Install Allure
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre wget unzip
          wget -qO- https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz | tar -xz
          sudo mv allure-2.24.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Generate Allure report
        run: |
          allure generate allure-results --clean -o allure-report

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          keep_files: false
          force_orphan: true